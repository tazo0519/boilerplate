# =====================================================================
# cloud 프로필 — dev/stg/prod 공유 원격 설정.
# dev/stg/prod 프로필은 application.yaml 의 spring.profiles.group 으로
# 이 프로필을 함께 활성화한다. 접속정보·풀크기 등 값 차이는 환경변수로 주입한다.
#   - prod 는 task definition 에서 DB_POOL_MIN=10, DB_POOL_MAX=30 주입(미설정 시 아래 default).
# =====================================================================
# ALB 뒤에서 X-Forwarded-* (client IP·scheme=https·host) 를 신뢰/반영.
# 로컬(application-local.yaml)은 프록시 뒤가 아니므로 설정하지 않는다(헤더 스푸핑 방지).
server:
  forward-headers-strategy: framework

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: ${DB_POOL_MIN:5}
      maximum-pool-size: ${DB_POOL_MAX:20}

# 구조화 로그(ECS format) → stdout → ECS awslogs/FireLens 수집
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}

# 운영 키는 KMS/Secret Manager에서 주입하고, 평문으로 yaml/git에 남기지 않는다.
# KMS/Secret Manager를 사용하지 않는다면 다음 대안이 있다 — 각각 한계가 명확하다:
#   - Jasypt 등 yaml 암호화: 마스터 키 보관 문제로 회귀 (chicken-and-egg)
#   - SOPS / sealed-secrets: git에 암호문 저장 + 복호화 키 별도 분배
#   - CI/CD Secrets: GitHub Actions / GitLab CI에 보관 후 배포 시 env 주입
# 어떤 방식을 채택할지는 정보보호팀·인프라팀 검토 후 결정한다.
#
# ⚠️ fail-fast: default 를 두지 않는다. ENCRYPTION_KEY_BASE64 미설정 시 placeholder 해석
#    실패로 부팅이 중단된다 → 공개 더미 키로 PII를 암호화하는 사고(yaml/git 공개 = 사실상 평문)를
#    원천 차단. dev/stg/prod 는 반드시 KMS/Secret Manager(또는 ECS taskdef secrets)에서 주입한다.
boilerplate:
  security:
    crypto:
      key-base64: ${ENCRYPTION_KEY_BASE64}
  # CORS — 쉼표로 구분된 허용 Origin/패턴 (예: https://app.example.com,https://*.example.com).
  # 미설정 시 CORS 비활성 → 동일 출처만 허용(안전 기본값). allowedOriginPatterns 라 와일드카드 패턴 허용.
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
