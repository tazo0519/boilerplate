name: CI

# master 로의 push / PR 마다 실행. 테스트를 두 레인으로 분리한다:
#   - unit        : Docker 불필요, 빠른 피드백 (항상)
#   - integration : Testcontainers(PostgreSQL), Docker 필요 (ubuntu 러너에 내장)
# 문서만 바뀐 변경은 스킵.
on:
  push:
    branches: [ master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ '**.md', 'docs/**' ]

permissions:
  contents: read

# 같은 ref 의 이전 실행은 취소(PR 연속 푸시 시 낭비 방지)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # gradlew.jar 무결성 검증 — gradlew 실행 전에 수행
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # build = 컴파일 + 단위 test(integration 제외) + bootJar. Docker 불필요.
      - name: Build & unit test
        run: ./gradlew build --no-daemon
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # Testcontainers(PostgreSQL) — ubuntu 러너의 Docker 로 동작.
      - name: Integration test
        run: ./gradlew integrationTest --no-daemon
      - name: Upload integration test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest
          if-no-files-found: ignore
          retention-days: 7
