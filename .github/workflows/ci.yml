name: CI

# master 로의 push / PR 마다 빌드 + 테스트(Testcontainers 포함) 실행.
# GitHub-hosted ubuntu 러너에는 Docker 가 있어 Testcontainers(PostgreSQL)가 그대로 동작한다.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# 최소 권한
permissions:
  contents: read

# 같은 ref 의 이전 실행은 취소(PR 연속 푸시 시 낭비 방지)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradlew.jar 무결성 검증(임의 변조된 wrapper 실행 방지) — gradlew 실행 전에 수행
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시/실행 최적화
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # test(Testcontainers 포함) + bootJar 조립
      - name: Build & Test
        run: ./gradlew build --no-daemon

      # 실패해도 리포트는 업로드
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
