spring:
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

---
# 로컬 개발 — PostgreSQL (docker compose 로 기동). 미설정 시 아래 default 사용.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:boilerplate}
    username: ${DB_USERNAME:boilerplate}
    password: ${DB_PASSWORD:local1234}
    hikari:
      minimum-idle: 4
      maximum-pool-size: 4
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# 테스트 전용 — Testcontainers(PostgreSQL 16)가 데이터소스를 주입(@ServiceConnection).
# 스키마는 컨테이너 기동 시 db/schema.sql(운영과 동일 DDL)로 적재하며,
# ddl-auto 는 상단 기본값(none)을 상속해 실제 스키마 드리프트까지 검증한다.
# ※ 실행에 Docker 필요.
spring:
  config:
    activate:
      on-profile: test
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

