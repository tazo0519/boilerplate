# =====================================================================
# 로컬 개발용 compose — PostgreSQL 16 + 애플리케이션(local 프로필)
#
#   기동:  docker compose up --build
#   종료:  docker compose down          (데이터 유지)
#   초기화: docker compose down -v       (DB 볼륨까지 삭제)
#
# ※ 로컬 전용입니다. 운영/ECS 배포에는 사용하지 마세요.
#   여기의 값은 로컬 더미이며, 실제 시크릿은 커밋 금지입니다.
# =====================================================================

services:
  postgres:
    image: postgres:16
    container_name: boilerplate-postgres
    environment:
      POSTGRES_DB: boilerplate
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: local1234          # 로컬 더미 — 운영 사용 금지
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 스키마는 앱이 부팅하며 Flyway(db/migration)로 직접 적용한다 — init 스크립트 마운트 불필요.
      # (Flyway 도입 이전 볼륨이 남아 있으면 `docker compose down -v` 로 초기화)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate -d boilerplate"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boilerplate-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres                     # compose 네트워크상의 서비스명
      DB_PORT: 5432
      DB_NAME: boilerplate
      DB_USERNAME: boilerplate
      DB_PASSWORD: local1234                # 로컬 더미 — 운영 사용 금지
      # 양방향 암호화 키(Base64 32byte). local 프로필은 미설정 시 로컬 fallback 키로 부팅됨.
      # 명시 주입하려면 아래 주석 해제 (로컬 더미 — 운영 사용 금지):
      # ENCRYPTION_KEY_BASE64: "TG9jYWxPbmx5RG9Ob3RVc2VJblByb2QhMTIzNDU2Nzg="
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    healthcheck:
      # JRE 이미지에 curl/wget 이 없어 로컬은 TCP 오픈 여부로만 확인(temurin 의 bash 사용).
      # 운영에서는 ALB 타깃그룹이 /actuator/health/readiness 로 HTTP 헬스체크(컨테이너 내 도구 불필요).
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

volumes:
  postgres-data:
