spring:
  application:
    name: boilerplate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    # dev/stg/prod 는 공유 원격 설정(application-cloud.yaml)을 함께 활성화한다.
    # 환경 고유값은 각 프로필 파일(application-prod.yaml 등) 또는 환경변수로만 표현한다.
    group:
      dev: cloud
      stg: cloud
      prod: cloud
  config:
    import:
      - optional:file:./.env[.properties]
  # 인플라이트 요청 드레이닝 시간. ECS task def stopTimeout(권장 ≥ 45s) 보다 작게,
  # ALB deregistration delay 는 이 시간을 덮도록 설정한다.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
      whitelabel:
        enabled: false

  # --- 공통: 페이징(offset 기반) 안전장치. 클라이언트의 과도한 size 로 인한 대량 조회 방지. ---
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100            # size 상한 — 초과 요청은 100 으로 캡
        one-indexed-parameters: false # page 파라미터는 0-based 유지(규약 명시)

  # --- 모든 프로필 공통: JPA (DB 는 전 프로필 PostgreSQL) ---
  # 스키마는 Flyway(db/migration/V*.sql)가 부팅 시 적용하고,
  # validate 가 "엔티티 ↔ 실제 스키마" 드리프트를 모든 환경의 부팅에서 잡는다(fail-fast).
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- 공통: HTTP 클라이언트 ---
  http:
    # 전역 기본 타임아웃 (그룹별 미설정 시 fallback)
    clients:
      connect-timeout: 3s
      read-timeout: 10s
    # 외부 연동 — HTTP Service Group 별 설정 (등록: HttpServiceClientsConfig 의 @ImportHttpServices)
    # 예) spring.http.serviceclient.{대상}: base-url / default-header(API 키 등) / read-timeout / apiversion

# --- 공통: 로깅(패턴/레벨 기본) ---
logging:
  level:
    root: INFO
    # 405/404 시 프레임워크 자체 WARN(PageNotFound 로거)이 GlobalExceptionHandler 로그와 중복되어 침묵
    org.springframework.web.servlet.PageNotFound: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{traceId:-}] %-40.40logger{39} : %m%n"

# --- 공통: 액세스 로그 제외 경로 (헬스체크 폴링 노이즈 제거 — MdcLoggingProperties) ---
boilerplate:
  logging:
    exclude-paths:
      - /actuator/health
      - /actuator/health/**

# --- 공통: OpenAPI/Swagger 경로 (비활성화는 프로필별) ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# --- 공통: 서버/종료 ---
# graceful shutdown: SIGTERM 수신 시 새 요청 거절 + 진행 요청 완료까지 대기.
# (Dockerfile 의 exec 로 JVM 이 PID 1 이 되어 SIGTERM 을 직접 받는다)
server:
  shutdown: graceful

# --- 공통: Actuator 헬스 (ALB 타깃그룹 / ECS 헬스체크 대상) ---
# ALB readiness → /actuator/health/readiness, liveness → /actuator/health/liveness
management:
  endpoints:
    web:
      exposure:
        include: health          # health 만 노출(최소 표면적). ALB 리스너에서 /actuator 차단 권장(방어심화)
  endpoint:
    health:
      probes:
        enabled: true            # ECS 는 K8s 가 아니므로 프로브를 명시 활성화
      show-details: never        # 컴포넌트 상세 비노출(정보 노출 방지)
      group:
        # DB 다운 시 readiness DOWN → ALB 가 해당 태스크로 트래픽 미전송
        readiness:
          include: readinessState, db
        # liveness 는 기본(livenessState)만 — DB 블립으로 컨테이너가 재시작되지 않도록 db 미포함
        liveness:
          include: livenessState
