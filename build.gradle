plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'boilerplate'

// build-info.properties 생성 → BuildProperties 빈(actuator /info, OpenAPI 버전 소스).
// 버전을 코드에 하드코딩하지 않고 이 단일 소스(build.gradle version)에서 읽게 한다.
// build.time 은 제외 — 매 빌드 jar 바이트가 바뀌어 Docker 레이어 캐시가 무효화되는 것을 방지(재현 빌드).
springBoot {
    buildInfo {
        properties {
            excludes = ['time']
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-restclient'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    // Boot 4 모듈화: Flyway 자동구성은 코어가 아니라 spring-boot-flyway 모듈에 있다 —
    // flyway-core 만 넣으면 라이브러리만 있고 마이그레이션이 실행되지 않는다(실측).
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// 단위 테스트(빠른 레인): integration 태그 제외 — Docker 불필요
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// 통합 테스트: integration 태그만 (Testcontainers 등, Docker 필요).
// check/build 에 엮지 않으므로 `./gradlew build` 는 단위만 돌아 Docker 없이 통과한다.
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests tagged "integration" (Testcontainers, requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}
